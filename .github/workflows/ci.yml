name: Enterprise LLM Gateway & Governance CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-validate:
    name: Validate Policies, Schemas & Copilot Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml pytest pytest-cov

      - name: Validate APIM Policy XML Well-Formedness
        run: |
          python -c "import xml.etree.ElementTree as ET
          ET.parse('policies/azure-apim-policy.xml')
          ET.parse('policies/azure-apim-policy-enhanced.xml')
          ET.parse('policies/fragments/routing.xml')
          ET.parse('policies/fragments/chargeback.xml')
          ET.parse('policies/fragments/guardrails.xml')
          print('All APIM XML policies well-formed!')"

      - name: Lint CI Workflow YAML
        run: |
          python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('CI Workflow YAML Valid!')"

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=src
